<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>PokéSurvivor · Ativar conta</title>
  <style>
    @font-face { font-family: PokemonGen3; src: url('/assets/fonts/gen3/PokemonGen3-mono.woff2') format('woff2'); font-weight: 400 900; font-display: swap; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px 20px; min-height: 100svh; display: grid; place-items: center; background: #14292e; color: #283c43; font: 22px/1.3 PokemonGen3,'Segoe UI',sans-serif; }
    main { width: min(100%,440px); padding: 28px; border: 3px solid #38545b; border-radius: 3px; background: #f8f7e9; box-shadow: 0 0 0 2px #d9e4d4, inset 0 0 0 3px #b9cec2, inset 0 0 0 5px #fffdf0, 4px 6px 0 #0b1b2085; }
    .brand { margin: 0 0 24px; color: #b84638; font-size: 32px; text-shadow: 2px 2px #dfcda1; }
    h1 { margin: 0; font: 700 30px/1.2 PokemonGen3,'Segoe UI',sans-serif; }
    p { margin: 16px 0; }
    #identity { padding: 12px; border: 1px solid #9eb3a9; background: #e5e9dd; overflow-wrap: anywhere; }
    #status { color: #53676b; }
    #status.error { color: #ad2336; }
    button,.back { width: 100%; display: block; padding: 10px 16px; min-height: 48px; margin-top: 12px; border: 2px solid #49636a; border-radius: 2px; font: 22px/1.2 PokemonGen3,'Segoe UI',sans-serif; text-align: center; cursor: pointer; box-shadow: inset 0 0 0 2px #fffdf2, 0 3px 0 #243b43; }
    #activate { color: #fffdf3; background: #b84638; border-color: #6c2c2a; box-shadow: inset 0 0 0 2px #dd7963, 0 3px 0 #502729; }
    #google { color: #283c43; background: #fffef6; }
    .back { color: #315d69; background: none; text-decoration: underline; border-color: transparent; box-shadow: none; }
    button:focus-visible,a:focus-visible { outline: 3px solid #b84638; outline-offset: 3px; }
    button:disabled { opacity: .6; cursor: wait; }
    [hidden] { display: none !important; }
    footer { margin-top: 24px; font-size: 18px; color: #53676b; }
    @media (max-width: 480px), (max-height: 520px) { body { padding: 16px; } main { padding: 20px; } }
  </style>
  <script defer src="activation.js"></script>
</head>
<body>
  <main aria-labelledby="title">
    <p class="brand">PokéSurvivor</p>
    <h1 id="title">Ativar conta da beta</h1>
    <p id="description">Recupere sua conta e continue de onde parou.</p>
    <p id="identity" hidden></p>
    <p id="status" role="status" aria-live="polite">Conferindo seu link…</p>
    <button id="activate" hidden>Ativar conta</button>
    <button id="google" hidden>Continuar com Google</button>
    <a class="back" href="/" id="back">Voltar ao jogo</a>
    <footer id="footer">Este link é pessoal e só pode ser usado uma vez.</footer>
  </main>
</body>
</html>
